<script>
/* Every project slider (see the note in the site head), on Home and on the service pages (Service Cases). Clicking the card
   opens the slider on the first page (Home), the left side screen on the 2nd page and the right one on the 3rd.
   The slides come from the card (on Home the CMS item): the images in a list marked
   data-gallery-full if there is one, otherwise the hidden "Other images every project section" list (big page screenshots,
   first = Home), otherwise the middle screen. The logo is the one on the card,
   data-gallery-domain / data-gallery-pages (comma separated page names) give the caption under the slide.
   It is in the site head (the site footer is near Webflow's size limit), so it waits for the page to be parsed. */
document.addEventListener('DOMContentLoaded', function () {
  var cards = [].slice.call(document.querySelectorAll('[data-project-gallery]'));
  if (!cards.length) return;
  var RATIO = 2940 / 1670, still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ZOOM = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3H3v3M10 3h3v3M6 13H3v-3M10 13h3v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHEV = '<svg viewBox="0 0 24 43" fill="none" aria-hidden="true"><path d="M22 2L3 21.5 22 41" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function shown(img) {
    return img && img.getAttribute('src') && !img.classList.contains('w-dyn-bind-empty') && !img.closest('.w-condition-invisible');
  }
  // the biggest file Webflow made for an image (its srcset), so the slide stays sharp
  function biggest(img) {
    var src = img.getAttribute('src'), best = 0;
    (img.getAttribute('srcset') || '').split(',').forEach(function (c) {
      var p = c.trim().split(/\s+/), w = parseFloat(p[1]);
      if (p[0] && w > best) { best = w; src = p[0]; }
    });
    return src;
  }
  // the card's three screens, in slide order: middle (1st page), left (2nd), right (3rd)
  function frames(c) {
    return ['.home-projects_screen-frame:not(.is-left):not(.is-right)', '.home-projects_screen-frame.is-left', '.home-projects_screen-frame.is-right']
      .map(function (s) { return c.querySelector(s); });
  }
  function slidesOf(card) {
    var full = [].slice.call(card.querySelectorAll('[data-gallery-full] img')).filter(shown);
    var pagesList = [].slice.call(card.querySelectorAll('.home-projects_thumb')).filter(shown);
    var middle = frames(card)[0], mid = middle && middle.querySelector('img');
    var imgs = full.length ? full : (pagesList.length ? pagesList : [mid].filter(shown));
    var pages = (card.getAttribute('data-gallery-pages') || '').split(',').map(function (s) { return s.trim(); });
    return imgs.map(function (img, i) {
      return { src: biggest(img), thumb: img.currentSrc || img.getAttribute('src'), page: pages[i] || (i ? '' : 'Home') };
    });

  var pg = document.createElement('div');
  pg.className = 'pg';
  pg.setAttribute('role', 'dialog');
  pg.setAttribute('aria-modal', 'true');
  pg.setAttribute('aria-label', 'Project gallery');
  pg.innerHTML = '<div class="pg_dim"></div>' +
    '<div class="pg_top"><span class="pg_logo"></span><button type="button" class="pg_close" aria-label="Close gallery"><i></i><i></i></button></div>' +
    '<p class="pg_count" aria-live="polite"></p>' +
    '<div class="pg_frame"><div class="pg_stage"></div>' +
    '<button type="button" class="pg_arrow is-prev" aria-label="Previous screen">' + CHEV + '</button>' +
    '<button type="button" class="pg_arrow is-next" aria-label="Next screen">' + CHEV.replace('M22 2L3 21.5 22 41', 'M2 2l19 19.5L2 41') + '</button></div>' +
    '<p class="pg_cap"></p><div class="pg_thumbs"></div>';
  document.body.appendChild(pg);
  var dim = pg.querySelector('.pg_dim'), logo = pg.querySelector('.pg_logo'), count = pg.querySelector('.pg_count'),
      stage = pg.querySelector('.pg_stage'), cap = pg.querySelector('.pg_cap'), dots = pg.querySelector('.pg_thumbs'),
      prev = pg.querySelector('.is-prev'), next = pg.querySelector('.is-next'), closeBtn = pg.querySelector('.pg_close');
  var card = null, slides = [], els = [], cur = 0, W = 0, H = 0, dragX = 0, opener = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function size() {
    var vw = window.innerWidth, vh = window.innerHeight, mob = vw < 768;
    var maxW = mob ? vw - 32 : Math.min(1056, vw * .7333, vw - (vw < 992 ? 160 : 300));
    var chrome = mob ? 290 : 470;

    pg.style.setProperty('--pg-h', H + 'px');

  function place(anim) {
    var gap = W * .9;
    els.forEach(function (el, i) {
      var d = i - cur + dragX / gap, a = Math.min(Math.abs(d), 1.6), k = Math.min(a, 1);
      el.classList.toggle('is-anim', !!anim);
      el.style.transform = 'translateX(' + (d * gap) + 'px) scale(' + (1 - k * .16) + ')';
      el.style.filter = 'brightness(' + (1 - k * .68) + ')';

      el.style.zIndex = 10 - Math.round(a * 3);

  // (No growing out of the card: the card screens and the slider pages have different shapes, so a morph stretches them.)

      { opacity: 0, transform: base + ' translateY(56px) scale(.94)', clipPath: 'inset(7% 7% 7% 7% round ' + r + ')' },
      { opacity: 1, transform: base, clipPath: 'inset(0% 0% 0% 0% round ' + r + ')' }
    ], { duration: 950, delay: 60, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
  }

    var base = el.style.transform;
    return el.animate([
      { opacity: 1, transform: base },
      { opacity: 0, transform: base + ' translateY(28px) scale(.97)' }
    ], { duration: 380, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
  }

  function open(c, i, from) {
    card = c; slides = slidesOf(c); if (!slides.length) return;
    cur = Math.max(0, Math.min(slides.length - 1, i)); opener = from || c;
    var info = c.closest('.home-projects_item, .svc-case_row'), lg = info && info.querySelector('.home-projects_logo-wrapper img, .svc-case_logo img');
    logo.innerHTML = lg && shown(lg) ? '<img src="' + (lg.currentSrc || lg.getAttribute('src')) + '" alt="' + (lg.getAttribute('alt') || '') + '">' : '';
    var font = info && info.querySelector('.home-projects_stat > *, .svc-case_value');
    if (font) pg.style.setProperty('--pg-font', getComputedStyle(font).fontFamily);
    stage.innerHTML = ''; dots.innerHTML = ''; els = [];
    var name = c.getAttribute('data-gallery-name') || (lg && lg.getAttribute('alt')) || '';
    slides.forEach(function (s, j) {
      var el = document.createElement('div');
      el.className = 'pg_slide';
      el.innerHTML = '<img src="' + s.src + '" alt="' + (name + ' ' + (s.page || 'page ' + (j + 1))).trim() + '" draggable="false">';
      stage.appendChild(el); els.push(el);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pg_thumb'; b.setAttribute('aria-label', 'Show ' + (s.page || 'screen ' + (j + 1)));
      b.innerHTML = '<img src="' + s.thumb + '" alt="">';
      b.addEventListener('click', function () { go(j); });
      dots.appendChild(b);
    });
    dots.style.display = slides.length > 1 ? '' : 'none';
    pg.classList.add('is-open');
    document.documentElement.style.overflow = 'hidden';
    size(); place(false);
    var el = els[cur];
    if (!still && el.animate) {
      riseIn(el);
      els.forEach(function (o, j) { if (j !== cur) o.animate([{ opacity: 0 }, { opacity: o.style.opacity }], { duration: 600, delay: 450, easing: 'ease', fill: 'backwards' }); });
    }
    setTimeout(function () { pg.classList.add('is-ready'); }, still ? 0 : 300);
    closeBtn.focus({ preventScroll: true });
  }
  function close() {
    if (!pg.classList.contains('is-open')) return;
    var el = els[cur];
    pg.classList.remove('is-ready');
    function done() {
      pg.classList.remove('is-open'); dim.style.opacity = '';
      document.documentElement.style.overflow = '';
      stage.innerHTML = ''; els = [];
      if (opener) opener.focus({ preventScroll: true });
    }
    if (!still && el && el.animate) {
      els.forEach(function (o, j) { if (j !== cur) o.style.opacity = 0; });
      el.classList.remove('is-anim');
      dim.style.opacity = 0;
      sinkOut(el).onfinish = done;
    } else done();
  }

  // the cards: the card opens the first slide, a side screen opens its own page (left 2nd, right 3rd)
  cards.forEach(function (c) {
    var shot = c.querySelector('.home-projects_image-wrapper') || c;
    var z = document.createElement('span'); z.className = 'pg-zoom'; z.innerHTML = ZOOM; shot.appendChild(z);
    c.setAttribute('role', 'button'); c.setAttribute('tabindex', '0');
    c.setAttribute('aria-label', 'Open ' + (c.getAttribute('data-gallery-name') || 'project') + ' gallery');
    var screens = frames(c), pages = slidesOf(c).length;
    screens.forEach(function (t, k) {
      if (t && k > 0 && k < pages) { t.setAttribute('role', 'button'); t.setAttribute('tabindex', '0'); t.setAttribute('aria-label', 'Open screen ' + (k + 1)); }
    });
    function which(e) {
      var t = e.target.closest('.home-projects_screen-frame'), k = t ? screens.indexOf(t) : -1;
      return k > 0 && k < pages ? { k: k, from: t } : { k: 0, from: c };
    }
    c.addEventListener('click', function (e) { var w = which(e); open(c, w.k, w.from); });
    c.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      var w = which(e); open(c, w.k, w.from);
    });
  });

  closeBtn.addEventListener('click', close);
  dim.addEventListener('click', close);
  prev.addEventListener('click', function () { go(cur - 1); });
  next.addEventListener('click', function () { go(cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (!pg.classList.contains('is-open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
    else if (e.key === 'Tab') {
      // keep keyboard focus inside the popup
      var f = [].slice.call(pg.querySelectorAll('button:not([disabled])')).filter(function (b) { return b.offsetParent; });
      var a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { z.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === z) { a.focus(); e.preventDefault(); }
    }
  });
  window.addEventListener('resize', function () { if (pg.classList.contains('is-open')) { size(); place(false); } });

  // drag or swipe between screens; a tap next to the screen closes the gallery
  var down = null, moved = false;
  stage.addEventListener('pointerdown', function (e) {
    down = { x: e.clientX, t: performance.now() }; moved = false;
    stage.setPointerCapture(e.pointerId); stage.classList.add('is-drag');
  });
  stage.addEventListener('pointermove', function (e) {
    if (!down) return;
    dragX = e.clientX - down.x; if (Math.abs(dragX) > 4) moved = true;
    if ((cur === 0 && dragX > 0) || (cur === slides.length - 1 && dragX < 0)) dragX *= .35;
    place(false);
  });
  function up(e) {
    if (!down) return;
    stage.classList.remove('is-drag');
    var v = dragX / Math.max(1, performance.now() - down.t), d = dragX; down = null;
    if (!moved) {
      var r = els[cur].getBoundingClientRect(); dragX = 0;
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) place(true); else close();
      return;
    }
    if (d < -W * .18 || v < -.5) go(cur + 1); else if (d > W * .18 || v > .5) go(cur - 1); else go(cur);
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
});
</script>

<!-- Nues 13.11.: two-tone text that writes in letter by letter, and bigger tap areas for small controls. -->
<style>
/* Two-tone sentences (Service Cases .svc-case_muted, Home Every project .text-reveal_muted): the whole sentence starts grey
   and every letter, the second part too, turns white one after another. The base .text-reveal_char rules above already do this
   for every letter, so the dark pages need nothing extra here.
   Our Work tabs heading (light card, .ow-cs_char letters from the Our Work page code): once revealed the grey part takes the
   heading colour, so its letters end dark navy like the first part instead of staying grey */
.is-revealed .ow-cs_muted { color: inherit; }
/* Bigger tap areas without changing the look: an invisible frame around small links, arrows and slider dots (about 40-44px) */
.footer-v2_link { position: relative; }
.footer-v2_link::after { content: ""; position: absolute; inset: -8px -6px; }
.lt-quote_arrow { overflow: visible; }
.lt-quote_arrow::after { content: ""; position: absolute; inset: -8px; }
.ins-feat-dot { position: relative; }
.ins-feat-dot::after { content: ""; position: absolute; inset: -18px -4px; }
</style>
<!-- Text that writes in letter by letter: Home Every project (.home-projects_description), Service Cases (.svc-case_text) and any
     [data-reveal-text]. Inner spans are kept, so the grey part of a two-tone sentence stays grey. In CMS text (Story label) a | marks
     where the grey part starts; it is turned into the grey span here, on Home and in the Our Work tabs (.ow-cs_item h3, which then
     keep this split instead of the "first third" rule). Runs before the older copy in the site footer, which skips elements done here. -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function splitMarker(el, cls) {
    if (el.children.length || el.textContent.indexOf('|') < 0) return;
    var parts = el.textContent.split('|');
    var first = parts.shift().replace(/\s+$/, ''), rest = parts.join(' ').replace(/\s+/g, ' ').trim();
    el.textContent = first + ' ';
    var s = document.createElement('span');
    s.className = cls;
    s.textContent = rest;
    el.appendChild(s);
  }
  document.querySelectorAll('.home-projects_description').forEach(function (el) { splitMarker(el, 'text-reveal_muted'); });
  document.querySelectorAll('.ow-cs_item h3').forEach(function (el) { splitMarker(el, 'ow-cs_muted'); });
  var els = [];
  document.querySelectorAll('.home-projects_description, .svc-case_text, [data-reveal-text]').forEach(function (el) {
    if (el.hasAttribute('data-text-reveal')) return;
    var text = el.textContent.replace(/\s+/g, ' ').trim();
    if (!text) return;
    var sr = document.createElement('span');
    sr.className = 'text-reveal_sr';
    sr.textContent = text;
    var visual = document.createElement('span');
    visual.setAttribute('aria-hidden', 'true');
    var chars = [], space = false;
    // letters become spans; a space between words stays a plain space so lines still break between words
    function add(target, str) {
      str.split('').forEach(function (ch) {
        if (/\s/.test(ch)) { space = true; return; }
        if (space && chars.length) target.appendChild(document.createTextNode(' '));
        space = false;
        var c = document.createElement('span');
        c.className = 'text-reveal_char';
        c.textContent = ch;
        target.appendChild(c);
        chars.push(c);
      });
    }
    // copy inner elements (e.g. the grey span) without their text, and fill them with letters
    function walk(node, target) {
      [].forEach.call(node.childNodes, function (n) {
        if (n.nodeType === 3) add(target, n.textContent);
        else if (n.nodeType === 1) { var copy = n.cloneNode(false); target.appendChild(copy); walk(n, copy); }
      });
    }
    walk(el, visual);
    // Short lines take about 1.4s, long paragraphs up to 2.4s, never slower than 28ms per letter
    var total = Math.max(1400, Math.min(2400, chars.length * 16));
    var step = Math.min(28, total / chars.length);
    chars.forEach(function (c, i) { c.style.transitionDelay = Math.round(i * step) + 'ms'; });
    el.textContent = '';
    el.appendChild(sr);
    el.appendChild(visual);
    el.setAttribute('data-text-reveal', '');
    els.push(el);
  });
  if (reduce || !('IntersectionObserver' in window)) {
    els.forEach(function (el) { el.classList.add('is-revealed'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-revealed');
      io.unobserve(entry.target);
    });
  }, { threshold: 0.6 });
  els.forEach(function (el) { io.observe(el); });
});
</script>
