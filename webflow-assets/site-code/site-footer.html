<script>
(function () {
  // Services opens on hover on desktop; inside the mobile menu it opens on tap.
  // Runs before webflow.js builds the dropdown, which reads data-hover once.
  var desktop = window.matchMedia('(min-width: 992px)').matches;
  document.querySelectorAll('.navbar2_component .w-dropdown[data-hover]').forEach(function (dd) { dd.setAttribute('data-hover', desktop ? 'true' : 'false'); });
  function init() {
    var nav = document.querySelector('.navbar2_component');
    if (!nav || nav.hasAttribute('data-nav-ready')) return;
    nav.setAttribute('data-nav-ready', '');
    var bg = nav.querySelector('[data-nav-bg]');
    function onScroll() { if (bg) bg.classList.toggle('is-scrolled', window.scrollY > 10); }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    // Service cards: the hovered (or focused) card expands; the first one is the default.
    var wrap = nav.querySelector('[data-nav-cards]');
    if (wrap) {
      var cards = Array.prototype.slice.call(wrap.querySelectorAll('.navbar_services-card'));
      var activate = function (card) { cards.forEach(function (c) { c.classList.toggle('is-active', c === card); }); };
      cards.forEach(function (c) {
        c.addEventListener('mouseenter', function () { activate(c); });
        c.addEventListener('focus', function () { activate(c); });
      });
      wrap.addEventListener('mouseleave', function () { activate(cards[0]); });
    }
    // Services and Resources are links too (navbar2_toggle-link, page links set in the Designer). With a mouse the menu opens
    // on hover and a click on the label opens the page; in the mobile menu and on touch screens a tap keeps opening the menu.
    var touch = window.matchMedia('(hover: none)').matches;
    nav.querySelectorAll('.w-dropdown-toggle .navbar2_toggle-link').forEach(function (a) {
      a.addEventListener('click', function (e) { if (!desktop || touch) e.preventDefault(); });
      // Enter on the label follows the link (Enter / Space on the rest of the toggle still opens the menu)
      a.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.stopPropagation(); });
    });
    // Hover menus (Services, Resources): moving from the toggle down to an item usually crosses the empty strip of the
    // navbar (for Resources, the items sit far to the left of it), and the menu used to close there. While a menu is open,
    // an invisible triangle from the pointer to the top edge of the panel counts as part of the menu (CSS: the panel's
    // ::before). It leaves out the toggle itself, so the label stays clickable, and it only lasts while the pointer is on
    // its way down, so the other nav links still work.
    if (desktop) {
      nav.querySelectorAll('.w-dropdown').forEach(function (dd) {
        var toggle = dd.querySelector('.w-dropdown-toggle'), list = dd.querySelector('.w-dropdown-list'), t = 0;
        if (!toggle || !list) return;
        var off = function () { clearTimeout(t); t = 0; list.style.setProperty('--nav-safe-h', '0px'); };
        toggle.addEventListener('mousemove', function (e) {
          clearTimeout(t); t = 0;
          var r = list.getBoundingClientRect(), b = toggle.getBoundingClientRect();
          var h = r.top - e.clientY, w = r.width, x = e.clientX - r.left;
          if (!w || h <= 0) { off(); return; }
          // where each side of the triangle leaves the toggle box (x from the panel's left edge, y from the pointer)
          var L = b.left - r.left, R = b.right - r.left, B = Math.min(h, b.bottom - e.clientY);
          var side = function (to, edge) { var y = to === x ? Infinity : h * (edge - x) / (to - x); return y < B ? [edge, y, 1] : [x + (to - x) * B / h, B, 0]; };
          var a = side(0, L), c = side(w, R), pts = [a, [0, h], [w, h], c];
          if (c[2]) pts.push([R, B]);
          if (a[2]) pts.push([L, B]);
          list.style.setProperty('--nav-safe-clip', 'polygon(' + pts.map(function (p) { return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(',') + ')');
          list.style.setProperty('--nav-safe-h', Math.ceil(h) + 'px');
        });
        list.addEventListener('mousemove', function (e) {
          if (e.clientY >= list.getBoundingClientRect().top) { clearTimeout(t); t = 0; return; }
          if (!t) t = setTimeout(off, 450);
        });
        dd.addEventListener('mouseleave', off);
      });
    }
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
<script>
/* Navbar: hides when the visitor scrolls down and comes back when they scroll up. The slide itself is the Webflow interaction
   "Navbar hide on scroll down, show on scroll up" (Interactions panel); this only tells it the direction with the custom events
   nav-hide / nav-show. It stays put near the top of the page, while a menu or dropdown is open, and when it gets keyboard focus. */
(function () {
  var nav = document.querySelector('.navbar2_component');
  if (!nav) return;
  var hidden = false, lastY = window.scrollY, ticking = false;
  function emit(name) {
    try { var ix = window.Webflow && Webflow.require && Webflow.require('ix3'); if (ix && ix.emit) { ix.emit(name); return true; } } catch (e) {}
    return false;
  }
  function show() { if (hidden && emit('nav-show')) hidden = false; }
  function update() {
    ticking = false;
    var y = Math.max(window.scrollY, 0), d = y - lastY;
    if (y <= nav.offsetHeight) { show(); lastY = y; return; }
    if (Math.abs(d) < 8) return;
    lastY = y;
    if (d < 0) show();
    else if (!hidden && !nav.querySelector('.w--open') && emit('nav-hide')) hidden = true;
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  nav.addEventListener('focusin', show);
})();
</script>

<script>
/* CMS item links: links to a Blogs or Our Works item built through the API publish without their address (href "#").
   Each such link carries the item's slug (data-cms-slug, bound to Slug in the Designer) and its folder (data-cms-base,
   e.g. /blog/ or /our-work/), and gets /blog/<slug> here. Links that already have their real address are left alone. */

    document.querySelectorAll('a[data-cms-slug]').forEach(function (a) {
      var slug = a.getAttribute('data-cms-slug'), href = a.getAttribute('href') || '';

<script>
/* Autoplay tabs: any native Webflow Tabs with data-tabs-autoplay. When the current tab's progress
   animation (tabs-progress) ends, the next tab opens. Paused off-screen and while a tab has keyboard focus. */
(function () {
  document.querySelectorAll('.w-tabs[data-tabs-autoplay]').forEach(function (root) {
    var menu = root.querySelector('.w-tab-menu'), content = root.querySelector('.w-tab-content');
    if (!menu || !content || root.hasAttribute('data-tabs-ready')) return;
    root.setAttribute('data-tabs-ready', '');
    var links = [].slice.call(menu.children), panes = [].slice.call(content.children);
    // Name each tab after its label so links and panes pair up uniquely before webflow.js reads them
    links.forEach(function (link, i) {
      var name = link.textContent.trim() || 'Tab ' + (i + 1);
      link.setAttribute('data-w-tab', name);
      link.classList.toggle('w--current', i === 0);
      if (panes[i]) {
        panes[i].setAttribute('data-w-tab', name);
        panes[i].classList.toggle('w--tab-active', i === 0);
      }
    });
    root.setAttribute('data-current', links[0].getAttribute('data-w-tab'));
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { root.classList.add('is-static'); return; }
    var focused = false, visible = false, auto = false;
    function sync() { root.classList.toggle('is-paused', focused || !visible); }
    sync();
    root.addEventListener('focusin', function (e) {
      if (auto) return;
      try { focused = e.target.matches(':focus-visible'); } catch (err) { focused = true; }
      sync();
    });
    root.addEventListener('focusout', function (e) {
      if (auto || root.contains(e.relatedTarget)) return;
      focused = false; sync();
    });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { visible = entries[0].isIntersecting; sync(); }, { threshold: 0.35 }).observe(root);
    } else { visible = true; sync(); }
    menu.addEventListener('animationend', function (e) {
      if (e.animationName !== 'tabs-progress') return;
      var current = menu.querySelector('.w--current');
      if (!current || !current.contains(e.target)) return;
      var next = links[(links.indexOf(current) + 1) % links.length];
      var prev = document.activeElement;
      auto = true;
      next.click();
      // webflow.js focuses the new tab; give focus back so autoplay never steals it
      if (prev && prev !== document.body && !menu.contains(prev)) prev.focus({ preventScroll: true });
      else if (!menu.contains(prev)) next.blur();
      auto = false;
    });
  });
})();
</script>

<script>
(function(){
  /* Video testimonials popup. Plays Vimeo links (vimeo.com/ID, vimeo.com/ID/HASH for unlisted videos,
     player.vimeo.com/video/ID?h=HASH) in an iframe, and anything else (.mp4) in a native <video>.
     Edit VIDEOS to change which video each client plays. Any element can override the source with
     data-video-src="https://vimeo.com/..." on the trigger or one of its parents. */
  var VIDEOS={intaker:'https://vimeo.com/1245476052',ballerine:'https://vimeo.com/1245476053'};
  var TRIGGERS='[data-video-src],.video-testimonial_media,.trusted_video';
  var modal, box, video, frame, closeBtn, lastFocus, warmed;
  function vimeo(u){
    var m=/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-f]+))?/i.exec(u||''); if(!m) return null;
    var h=m[2]||(/[?&]h=([0-9a-f]+)/i.exec(u)||[])[1];
    return 'https://player.vimeo.com/video/'+m[1]+'?autoplay=1&dnt=1&title=0&byline=0&portrait=0&playsinline=1'+(h?'&h='+h:'');
  }
  function warm(){
    if(warmed) return; warmed=1;
    ['https://player.vimeo.com','https://i.vimeocdn.com','https://f.vimeocdn.com'].forEach(function(h){ var l=document.createElement('link'); l.rel='preconnect'; l.href=h; l.crossOrigin=''; document.head.appendChild(l); });
  }
  function build(){
    modal=document.createElement('div'); modal.className='vmodal'; modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); modal.setAttribute('aria-label','Video testimonial');
    modal.innerHTML='<div class="vmodal_box"><button type="button" class="vmodal_close" aria-label="Close video"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><video class="vmodal_video" controls playsinline preload="none"></video></div>';
    document.body.appendChild(modal);
    box=modal.querySelector('.vmodal_box'); video=modal.querySelector('video'); closeBtn=modal.querySelector('.vmodal_close');
    closeBtn.addEventListener('click',close);
    modal.addEventListener('click',function(e){ if(e.target===modal) close(); });
    document.addEventListener('keydown',function(e){
      if(!modal.classList.contains('is-open')) return;
      if(e.key==='Escape') close();
      if(e.key==='Tab'){ var f=[closeBtn,frame||video]; var i=f.indexOf(document.activeElement); e.preventDefault(); f[(i+(e.shiftKey?f.length-1:1))%f.length].focus(); }
    });
  }
  function srcFor(t){
    var o=t.closest('[data-video-src]'); if(o&&o.getAttribute('data-video-src')) return o.getAttribute('data-video-src');
    var card=t.closest('.video-testimonial_card,.trusted_video,section')||t, txt=(card.textContent+' '+[].map.call(card.querySelectorAll('img[alt],[aria-label]'),function(n){return n.getAttribute('alt')||n.getAttribute('aria-label');}).join(' ')).toLowerCase();
    return txt.indexOf('ballerine')>-1?VIDEOS.ballerine:VIDEOS.intaker;
  }
  function dropFrame(){ if(frame){ frame.remove(); frame=null; } }
  function open(t){
    if(!modal) build();
    lastFocus=document.activeElement;
    var src=srcFor(t), v=vimeo(src);
    dropFrame();
    if(v){
      video.pause(); video.removeAttribute('src'); video.removeAttribute('poster');
      frame=document.createElement('iframe'); frame.className='vmodal_frame'; frame.title='Video testimonial'; frame.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#000';
      frame.allow='autoplay; fullscreen; picture-in-picture; encrypted-media'; frame.setAttribute('allowfullscreen',''); frame.src=v;
      box.appendChild(frame); modal.classList.add('is-vimeo'); video.style.display='none';
    } else {
      modal.classList.remove('is-vimeo'); video.style.display='';
      var card=t.closest('.video-testimonial_card,.trusted_video')||t, img=card.querySelector('.image-cover,.trusted_video-image,img');
      video.poster=img?(img.currentSrc||img.src):'';
      video.src=src; video.currentTime=0;
    }
    document.documentElement.classList.add('vmodal-lock');
    modal.classList.add('is-open');
    if(!v){ var p=video.play(); if(p&&p.catch) p.catch(function(){}); }
    setTimeout(function(){ closeBtn.focus(); },50);
  }
  function close(){
    modal.classList.remove('is-open');
    document.documentElement.classList.remove('vmodal-lock');
    video.pause();
    if(frame&&frame.contentWindow){ try{ frame.contentWindow.postMessage('{"method":"pause"}','https://player.vimeo.com'); }catch(err){} }
    setTimeout(function(){ if(!modal.classList.contains('is-open')){ dropFrame(); video.removeAttribute('src'); video.load(); } },400);
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  function prep(){
    [].forEach.call(document.querySelectorAll(TRIGGERS),function(el){
      if(el.closest('.w-editor')) return;
      el.setAttribute('data-vmodal-trigger','');
      var btn=el.matches('[role="button"]')?el:el.querySelector('[role="button"]');
      (btn||el).setAttribute('tabindex','0');
      if(!btn){ el.setAttribute('role','button'); if(!el.getAttribute('aria-label')) el.setAttribute('aria-label','Play video testimonial'); }
    });
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-vmodal-trigger]'); if(!t) return;
    e.preventDefault(); open(t);
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ') return;
    var t=e.target.closest&&e.target.closest('[data-vmodal-trigger]'); if(!t) return;
    e.preventDefault(); open(t);
  });
  /* Open the connection to Vimeo as soon as someone points at or focuses a video, so it starts faster */
  ['pointerover','focusin'].forEach(function(ev){ document.addEventListener(ev,function(e){ if(e.target.closest&&e.target.closest('[data-vmodal-trigger]')&&vimeo(srcFor(e.target.closest('[data-vmodal-trigger]')))) warm(); },{passive:true}); });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',prep); else prep();
})();
</script>
<script>
/* Service pages FAQ accordion: one answer open at a time, opening one closes the rest of its list */
(function () {
  function initFaq(root) {
    var items = [].slice.call(root.querySelectorAll('[data-svc-faq-item]'));
    function set(item, open) {
      var q = item.querySelector('[data-svc-faq-q]');
      item.classList.toggle('is-open', open);
      if (q) q.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    items.forEach(function (item) {
      var q = item.querySelector('[data-svc-faq-q]');
      if (!q) return;
      function toggle() {
        var open = !item.classList.contains('is-open');
        if (open) items.forEach(function (other) { if (other !== item && other.classList.contains('is-open')) set(other, false); });
        set(item, open);
      }
      q.addEventListener('click', toggle);
      q.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
  }
  function run() {
    document.querySelectorAll('[data-svc-faq]').forEach(initFaq);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', run); } else { run(); }
})();
</script>

(function () {

  function parse(doc) {

    var href = a && a.getAttribute('href'), slug = a && a.getAttribute('data-cms-slug');

/* Entrance animations (see the note in the site head): reveal [data-reveal] / [data-reveal-stagger] once they reach

        item.classList.add('reveal-run');

      setTimeout(function () {
        items.forEach(function (item) { item.classList.remove('reveal-run'); item.style.removeProperty('--reveal-delay'); });
      }, (last + DUR) * 1000 + 100);

/* Reviews animation (see the note in the site head). Works on top of the native Webflow Tabs and the autoplay above:

    links.forEach(function (l, i) { l.style.setProperty('--rv-c', colors[i] || ''); l.style.setProperty('--i', i); });
