<script>
  var mq = window.matchMedia('(max-width: 991px)');

  if (mq.matches) {
    var s1 = document.createElement('script');
    s1.src = 'https://cdn.jsdelivr.net/npm/@finsweet/attributes-selectcustom@1/selectcustom.js';
    s1.defer = true;
    document.head.appendChild(s1);

    var s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@finsweet/attributes-cmsselect@1/cmsselect.js';
    s2.async = true;
    document.head.appendChild(s2);
  } else {
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('select[fs-cmsfilter-field]').forEach(function (el) {
        el.removeAttribute('fs-cmsfilter-field');
      });
    });
  }

  // Reload samo kad se stvarno pređe granica 992px
  mq.addEventListener('change', function () {
    location.reload();
  });
</script>
