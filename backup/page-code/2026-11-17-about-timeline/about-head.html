
<style>
  /* === Sticky kamera === */
  .about-journey-camera {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Bela pozadina popunjava celu kameru */
  .about-journey-camera #section_layout366,
  .about-journey-camera .section_layout366 {
    min-height: 100vh;
  }

  .about-journey-camera > * {
    width: 100%;
  }

  .about-journey-camera > section,
  .about-journey-camera > div {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* === Padding section large - relative container za kartice === */
  .about-journey-camera .padding-section-large {
    position: relative;
    display: block !important;
  }

  /* === Kartice - stack jedna preko druge === */
  .about-journey-timeline_holder {
    transition: opacity 0.7s ease, transform 0.7s ease;
    opacity: 0;
    visibility: hidden;
    transform: translateY(40px);
    pointer-events: none;
  }

  .about-journey-timeline_holder:not(:first-child) {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  .about-journey-timeline_holder.is-active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* === Timer prsten - originalni stil koji radi === */
  .about-journey-timer_holder {
    border: 2px solid transparent !important;
    background: 
      linear-gradient(#fff, #fff) padding-box,
      conic-gradient(from -90deg, #DA2A90 0%, #DA2A90 var(--progress, 100%), #ffffff var(--progress, 100%), #ffffff 100%) border-box !important;
  }
</style>




<style>
  /* Default state - pruge */
  .about-teams-bg_line {
    background: linear-gradient(90deg, #17171D 0%, #66023C 100%);
    transform: rotateY(0deg);
    transition: transform 400ms ease, background 400ms ease;
    transform-style: preserve-3d;
    backface-visibility: visible;
    will-change: transform, background;
  }
  
  /* Hover state - pruge */
  .about-teams-card:hover .about-teams-bg_line {
    background: linear-gradient(270deg, #DA2A90 0%, #66023C 100%);
    transform: rotateY(180deg);
  }
  
  /* Perspective na card */
  .about-teams-card {
    perspective: 1000px;
  }
  
  /* Image holder - shadow */
  .about-teams-image_holder {
    box-shadow: 0px 0px 4px 0px #FFFFFF;
    transition: box-shadow 400ms ease;
    will-change: box-shadow;
    transform: translate3d(0, 0, 0);
  }
  
  /* Hover state - image holder shadow */
  .about-teams-card:hover .about-teams-image_holder {
    box-shadow: 0px 0px 0px 2px #FFFFFF;
  }
</style>

<style>

<style>
/* About hero background: the N lines in the backdrop hum a touch brighter now and then, a soft band of light slides down
   through them, and a spot of light runs along the edge of the hill. The hero image stays a normal Webflow image;
   the script below draws the N lines of it once, brightened, into a canvas inside .about-hero_anim (right after the image).
   Everything moves with opacity and transform only, so the browser animates it on the graphics card without repainting. */
.about-hero_anim{container-type:size}
/* a box with the image's proportions, cropped like the image (object-fit: cover, centred) */
.ahb-stage{position:absolute;left:50%;top:50%;width:max(100cqw,156.522cqh);aspect-ratio:2880/1840;translate:-50% -50%}
/* the N only covers the top right of the image, so the brightened layers are cut to that part */
.ahb-box{position:absolute;left:44.444%;top:0;width:55.556%;height:79.783%;overflow:hidden}
.ahb-lift{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none}
.ahb-hum{opacity:0;animation:aboutHum 13s ease-in-out infinite;will-change:opacity}
