<script>
document.addEventListener('DOMContentLoaded', function () {
  const el = document.querySelector('.about-jurney-nues_wrapper');
  if (!el) return;

  // Podešavanja
  const DRAG_EASE = 0.18;    // brzina praćenja miša dok se vuče
  const RETURN_EASE = 0.06;  // sporije vraćanje u prvobitnu poziciju
  const MIN_DELTA = 0.01;

  let isDragging = false;
  let startX = 0, startY = 0;
  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;
  let rafId = null;

  function animate() {
    const ease = isDragging ? DRAG_EASE : RETURN_EASE;

    currentX += (targetX - currentX) * ease;
    currentY += (targetY - currentY) * ease;

    el.style.transform = 'translate(' + currentX + 'px, ' + currentY + 'px)';

    const stillMoving =
      Math.abs(targetX - currentX) > MIN_DELTA ||
      Math.abs(targetY - currentY) > MIN_DELTA;

    if (isDragging || stillMoving) {
      rafId = requestAnimationFrame(animate);
    } else {
      currentX = targetX;
      currentY = targetY;
      el.style.transform = 'translate(' + currentX + 'px, ' + currentY + 'px)';
      rafId = null;
    }
  }

  function getPoint(e) {
    if (e.touches && e.touches.length) return e.touches[0];
    return e;
  }

  function onDown(e) {
    isDragging = true;
    const p = getPoint(e);
    startX = p.clientX - targetX;
    startY = p.clientY - targetY;

    if (!rafId) animate();
    e.preventDefault();
  }

  function onMove(e) {
    if (!isDragging) return;
    const p = getPoint(e);
    targetX = p.clientX - startX;
    targetY = p.clientY - startY;
  }

  function onUp() {
    if (!isDragging) return;
    isDragging = false;
    targetX = 0;
    targetY = 0;
    if (!rafId) animate();
  }

  // Mouse
  el.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  // Touch
  el.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);
  window.addEventListener('touchcancel', onUp);
});
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var cards = document.querySelectorAll('.about-hero-card');
    if (!cards.length) return;

    // Breakpoint - ispod ovoga koristimo mobilnu logiku
    var MOBILE_BREAKPOINT = 768;

    // Trigger ratio za desktop/tablet (sticky video layout)
    var TRIGGER_RATIO_DESKTOP = 0.55;

    // Trigger ratio za mobile (vertikalni stack layout)
    // 0.7 = pali se kada centar kartice dođe na 70% visine ekrana
    // Povećaj (0.75, 0.8) za ranije; smanji (0.6, 0.5) za kasnije
    var TRIGGER_RATIO_MOBILE = 0.7;

    var ticking = false;

    function update() {
      var isMobile = window.innerWidth < MOBILE_BREAKPOINT;
      var triggerRatio = isMobile ? TRIGGER_RATIO_MOBILE : TRIGGER_RATIO_DESKTOP;
      var triggerLine = window.innerHeight * triggerRatio;

      cards.forEach(function (card) {
        var rect = card.getBoundingClientRect();
        var cardCenter = rect.top + rect.height / 2;

        if (cardCenter <= triggerLine) {
          card.classList.add('is-active');
        } else {
          card.classList.remove('is-active');
        }
      });

      ticking = false;
    }

    function onScroll() {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }

    update();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
  });
</script>

<script>
(function() {
  const COMPLETION_DURATION = 500;
  const REVERSE_DURATION = 500;
  const SCROLL_SMOOTHING = 0.05;
  const FILL_BUFFER = 0.2;
  const FORCE_FILL_DURATION = 200;
  const FORCE_EMPTY_DURATION = 200;
  const FAST_SKIP_DURATION = 150; // brza animacija kad korisnik preskace vise kartica odjednom
  
  const wrapper = document.querySelector('.about-journey-contact_holder');
  const camera = document.querySelector('.about-journey-camera');
  const cards = document.querySelectorAll('.about-journey-timeline_holder');
  
  if (!wrapper || !camera || cards.length === 0) {
    console.warn('Journey animation: missing elements');
    return;
  }

  const totalCards = cards.length;
  let currentIndex = 0;
  let rafId = null;
  let isPinned = false;
  let lastScrollY = window.scrollY;
  let scrollDirection = 'down';
  
  let animationMode = null;
  let animStartTime = null;
  let animStartProgress = 0;
  let animTargetProgress = 0;
  let pendingCardIndex = null;
  let pendingNextMode = null;
  
  let targetProgress = 100;
  let currentProgress = 100;
  
  let desiredIndex = 0;

  function setActiveCard(index) {
    if (index < 0 || index >= totalCards) return;
    cards.forEach((card, i) => {
      card.classList.toggle('is-active', i === index);
    });
    currentIndex = index;
  }

  function setTimerProgress(percent) {
    const activeCard = cards[currentIndex];
    if (!activeCard) return;
    const timer = activeCard.querySelector('.about-journey-timer_holder');
    if (timer) timer.style.setProperty('--progress', percent + '%');
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function startCompletionAnimation() {
    animationMode = 'completing';
    animStartTime = performance.now();
    animStartProgress = currentProgress;
    animTargetProgress = 100;
  }

  function startReverseAnimation() {
    animationMode = 'reversing';
    animStartTime = performance.now();
    animStartProgress = currentProgress;
    animTargetProgress = 0;
  }

  function startForceAnim(toValue, duration, onComplete) {
    animationMode = 'forcing';
    animStartTime = performance.now();
    animStartProgress = currentProgress;
    animTargetProgress = toValue;
    pendingNextMode = onComplete;
  }

  // Provera da li trenutni index zaostaje za desiredIndex i pokrece catch-up
  // Ako je razlika velika (2+), instant prebaci karticu sa brzom animacijom
  function checkCatchUp() {
    if (currentIndex === desiredIndex) return false;
    
    const distance = Math.abs(desiredIndex - currentIndex);
    
    // Ako je razlika 2+, instant skok na pravu karticu sa brzom animacijom
    if (distance >= 2) {
      const goingDown = desiredIndex > currentIndex;
      
      if (goingDown) {
        // Instant prebaci na desired-1, pa pusti normalnu force anim za zadnji korak
        setActiveCard(desiredIndex);
        currentProgress = 0;
        targetProgress = 0;
        setTimerProgress(0);
        animationMode = null;
      } else {
        setActiveCard(desiredIndex);
        currentProgress = 100;
        targetProgress = 100;
        setTimerProgress(100);
        animationMode = null;
      }
      return true;
    }
    
    // Razlika je tacno 1 - normalna force animacija
    if (desiredIndex > currentIndex) {
      pendingCardIndex = currentIndex + 1;
      startForceAnim(100, FORCE_FILL_DURATION, 'switchAndEmpty');
      return true;
    } else {
      pendingCardIndex = currentIndex - 1;
      startForceAnim(0, FORCE_EMPTY_DURATION, 'switchAndFill');
      return true;
    }
  }

  function tick(timestamp) {
    if (animationMode === 'completing') {
      const elapsed = timestamp - animStartTime;
      const t = Math.min(elapsed / COMPLETION_DURATION, 1);
      const eased = easeOutCubic(t);
      currentProgress = animStartProgress + (100 - animStartProgress) * eased;
      setTimerProgress(currentProgress);
      
      if (t >= 1) {
        animationMode = null;
        targetProgress = currentProgress;
      }
    }
    else if (animationMode === 'reversing') {
      const elapsed = timestamp - animStartTime;
      const t = Math.min(elapsed / REVERSE_DURATION, 1);
      const eased = easeInOutCubic(t);
      currentProgress = animStartProgress * (1 - eased);
      setTimerProgress(currentProgress);
      
      if (t >= 1) {
        animationMode = null;
        targetProgress = currentProgress;
        checkCatchUp();
      }
    }
    else if (animationMode === 'forcing') {
      const duration = (animStartProgress < animTargetProgress) ? FORCE_FILL_DURATION : FORCE_EMPTY_DURATION;
      const elapsed = timestamp - animStartTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(t);
      currentProgress = animStartProgress + (animTargetProgress - animStartProgress) * eased;
      setTimerProgress(currentProgress);
      
      if (t >= 1) {
        currentProgress = animTargetProgress;
        setTimerProgress(currentProgress);
        
        if (pendingNextMode === 'switchAndEmpty') {
          if (pendingCardIndex !== null) {
            setActiveCard(pendingCardIndex);
            pendingCardIndex = null;
          }
          startForceAnim(0, FORCE_EMPTY_DURATION, 'done');
        } else if (pendingNextMode === 'switchAndFill') {
          if (pendingCardIndex !== null) {
            setActiveCard(pendingCardIndex);
            pendingCardIndex = null;
          }
          startForceAnim(100, FORCE_FILL_DURATION, 'done');
        } else {
          animationMode = null;
          pendingNextMode = null;
          targetProgress = currentProgress;
          checkCatchUp();
        }
      }
    }
    else {
      const diff = targetProgress - currentProgress;
      if (Math.abs(diff) > 0.05) {
        currentProgress += diff * SCROLL_SMOOTHING;
        setTimerProgress(currentProgress);
      } else if (currentProgress !== targetProgress) {
        currentProgress = targetProgress;
        setTimerProgress(currentProgress);
      }
    }
    
    rafId = requestAnimationFrame(tick);
  }

  function checkPinned() {
    const rect = wrapper.getBoundingClientRect();
    const wrapperHeight = wrapper.offsetHeight;
    const viewportHeight = window.innerHeight;
    const scrollableDistance = wrapperHeight - viewportHeight;
    
    const currentScrollY = window.scrollY;
    if (currentScrollY > lastScrollY) {
      scrollDirection = 'down';
    } else if (currentScrollY < lastScrollY) {
      scrollDirection = 'up';
    }
    lastScrollY = currentScrollY;
    
    const wasPinned = isPinned;
    isPinned = rect.top <= 0 && rect.bottom > viewportHeight;
    
    camera.classList.toggle('is-pinned', isPinned);
    
    if (isPinned && !wasPinned) {
      if (currentProgress > 0 && scrollDirection === 'down') {
        startReverseAnimation();
      } else if (scrollDirection === 'up') {
        currentProgress = 100;
        targetProgress = 100;
        setTimerProgress(100);
        animationMode = null;
      } else {
        animationMode = null;
      }
    }
    
    if (!isPinned && wasPinned) {
      if (rect.top > 0) {
        setActiveCard(0);
        desiredIndex = 0;
        pendingCardIndex = null;
        pendingNextMode = null;
        
        if (currentProgress < 100) {
          startCompletionAnimation();
        }
      } else {
        setActiveCard(totalCards - 1);
        desiredIndex = totalCards - 1;
        pendingCardIndex = null;
        pendingNextMode = null;
        
        if (currentProgress < 100) {
          startCompletionAnimation();
        }
      }
    }
    
    // Tokom animacije - samo azuriraj desiredIndex
    if (animationMode === 'forcing' || animationMode === 'reversing') {
      if (isPinned && scrollableDistance > 0) {
        const scrolled = -rect.top;
        const globalProgress = Math.max(0, Math.min(0.9999, scrolled / scrollableDistance));
        const progressInCards = globalProgress * totalCards;
        desiredIndex = Math.min(Math.floor(progressInCards), totalCards - 1);
      }
      return;
    }
    
    if (isPinned && scrollableDistance > 0) {
      const scrolled = -rect.top;
      const globalProgress = Math.max(0, Math.min(0.9999, scrolled / scrollableDistance));
      
      const progressInCards = globalProgress * totalCards;
      const targetIndex = Math.min(Math.floor(progressInCards), totalCards - 1);
      const rawLocalProgress = progressInCards - targetIndex;
      
      desiredIndex = targetIndex;
      
      let localProgress;
      if (rawLocalProgress >= (1 - FILL_BUFFER)) {
        localProgress = 100;
      } else {
        localProgress = (rawLocalProgress / (1 - FILL_BUFFER)) * 100;
      }
      
      // Kartica se menja
      if (targetIndex !== currentIndex) {
        const distance = Math.abs(targetIndex - currentIndex);
        
        // Veliki preskok - instant pozicija + brza animacija
        if (distance >= 2) {
          setActiveCard(targetIndex);
          const goingDown = targetIndex > currentIndex;
          if (goingDown) {
            currentProgress = 0;
            setTimerProgress(0);
            targetProgress = localProgress;
          } else {
            currentProgress = 100;
            setTimerProgress(100);
            targetProgress = localProgress;
          }
          return;
        }
        
        // Razlika 1 - normalna force animacija
        const goingDown = targetIndex > currentIndex;
        if (goingDown) {
          pendingCardIndex = currentIndex + 1;
          startForceAnim(100, FORCE_FILL_DURATION, 'switchAndEmpty');
        } else {
          pendingCardIndex = currentIndex - 1;
          startForceAnim(0, FORCE_EMPTY_DURATION, 'switchAndFill');
        }
        return;
      }
      
      if (animationMode !== 'completing') {
        targetProgress = localProgress;
      }
    }
  }
  
  window.addEventListener('scroll', checkPinned, { passive: true });
  window.addEventListener('resize', checkPinned, { passive: true });

  setActiveCard(0);
  currentProgress = 100;
  targetProgress = 100;
  setTimerProgress(100);
  lastScrollY = window.scrollY;
  desiredIndex = 0;
  checkPinned();
  rafId = requestAnimationFrame(tick);
})();
</script>

<script>
/* About map stats: each number counts up from 0 once it reaches the screen, a beat after the stats rise in.
   Set the target with data-count and the length in ms with data-count-duration; the page text keeps the final number. */
(function () {
  function count(el, delay) {
    var end = parseFloat(el.getAttribute('data-count')) || 0, dur = parseFloat(el.getAttribute('data-count-duration')) || 1600;
    setTimeout(function () {
      var t0 = performance.now();
      (function step(now) {
        var t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4);
        el.textContent = Math.round(end * e);
        if (t < 1) requestAnimationFrame(step);
      })(t0);
    }, delay);
  }
  function init() {
    var nums = [].slice.call(document.querySelectorAll('[data-count]'));
    if (!nums.length) return;
    if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      nums.forEach(function (el) { el.textContent = el.getAttribute('data-count'); });
      return;
    }
    nums.forEach(function (el) { el.textContent = '0'; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        // Follow the stats' one-after-another entrance
        var item = e.target.closest('[data-reveal-stagger] > *'), k = item ? [].indexOf.call(item.parentNode.children, item) : 0;
        count(e.target, 250 + Math.min(k * 80, 640));
      });
    }, { rootMargin: '0px 0px -12% 0px' });
    nums.forEach(function (el) { io.observe(el); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
